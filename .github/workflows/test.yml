name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm 11
        run: sh pnpm-install.sh
        env:
          PNPM_VERSION: 11.17.0
          PNPM_HOME: ${{ runner.temp }}/pnpm-home

      - name: Verify pnpm 11 works
        run: |
          export PNPM_HOME="${{ runner.temp }}/pnpm-home"
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm --version

      - name: Switch to pnpm 12 via pnpm use
        run: |
          export PNPM_HOME="${{ runner.temp }}/pnpm-home"
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm use 12.0.0-alpha.21
          pnpm --version
