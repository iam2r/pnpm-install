name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Note: macos-13 (Intel Mac) is no longer available on GitHub Actions
        # as of 2025. Test the Intel Mac v11 fallback locally with:
        # PNPM_NPM_PACK=true PNPM_VERSION=11.17.0 sh pnpm-install.sh
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # --- Standard install path (GitHub release) ---
      - name: Install latest (standard path)
        run: sh pnpm-install.sh
        env:
          PNPM_HOME: ${{ runner.temp }}/p1

      - name: Verify latest version
        run: |
          export PNPM_HOME="${{ runner.temp }}/p1"
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm --version
          echo "OK: latest pnpm installed"

      - name: Test self-update (latest → same)
        run: |
          export PNPM_HOME="${{ runner.temp }}/p1"
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm self-update --help
          pnpm self-update
          echo "OK: self-update works"

      # --- npm-pack fallback (simulates Intel Mac v11) ---
      - name: Install v11 via npm-pack fallback
        run: sh pnpm-install.sh
        env:
          PNPM_VERSION: 11.17.0
          PNPM_NPM_PACK: "true"
          PNPM_HOME: ${{ runner.temp }}/p2

      - name: Verify npm-pack install
        run: |
          export PNPM_HOME="${{ runner.temp }}/p2"
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm --version
          pnpm store path
          echo "OK: npm-pack install works"

      - name: Self-update from npm-pack v11 to latest
        run: |
          export PNPM_HOME="${{ runner.temp }}/p2"
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm self-update
          echo "OK: self-update from v11 works"

      # --- v9 install + self-update to v11 ---
      - name: Install v9 + self-update to v11
        run: |
          sh pnpm-install.sh
          export PNPM_HOME="${{ runner.temp }}/p3"
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm --version
          pnpm self-update 11.17.0
          pnpm --version
          echo "OK: v9 → v11 upgrade works"
        env:
          PNPM_VERSION: 9.15.9
          PNPM_HOME: ${{ runner.temp }}/p3

      # --- v10 install + self-update to v11 ---
      - name: Install v10 + self-update to v11
        run: |
          sh pnpm-install.sh
          export PNPM_HOME="${{ runner.temp }}/p4"
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm --version
          pnpm self-update 11.17.0
          pnpm --version
          echo "OK: v10 → v11 upgrade works"
        env:
          PNPM_VERSION: 10.34.5
          PNPM_HOME: ${{ runner.temp }}/p4

      # --- Smoke test: pnpm commands work ---
      - name: Smoke test (install a package)
        run: |
          export PNPM_HOME="${{ runner.temp }}/p2"
          export PATH="$PNPM_HOME/bin:$PATH"
          cd "$(mktemp -d)"
          pnpm init 2>/dev/null
          pnpm add is-odd --no-optional --ignore-scripts
          echo "OK: pnpm add works"
        env:
          PNPM_HOME: ${{ runner.temp }}/p2

  # Platform-default PNPM_HOME: no env var set so detect_pnpm_home()
  # determines the path. On macOS this must be ~/Library/pnpm, on Linux
  # ~/.local/share/pnpm. Verifies that pnpm setup --force writes the
  # same value that the script used.
  platform-default:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Remove any PNPM_HOME that the runner inherited so detect_pnpm_home
      # runs its platform default branch. Also clean pre-existing pnpm dirs
      # to get a clean baseline.
      - name: Install with platform-default PNPM_HOME
        run: |
          unset PNPM_HOME
          rm -rf "$HOME/.local/share/pnpm" "$HOME/Library/pnpm"
          sh pnpm-install.sh

      - name: Verify path matches platform convention
        run: |
          case "$RUNNER_OS" in
            macOS) expected="$HOME/Library/pnpm" ;;
            Linux) expected="$HOME/.local/share/pnpm" ;;
          esac
          export PNPM_HOME="$expected"
          export PATH="$PNPM_HOME/bin:$PATH"
          actual="$(pnpm --version 2>&1)"
          echo "pnpm version: $actual"
          echo "PNPM_HOME: $expected"
          [ -f "$expected/bin/pnpm" ] || { echo "ERROR: wrapper not at $expected/bin/pnpm"; exit 1; }
          [ -f "$expected/pnpm-install.sh" ] || { echo "ERROR: installer missing"; exit 1; }
          echo "OK: platform-default path works"
